name: Build ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install ARM64 cross-compiler and SDL2 libs
        run: |
          CODENAME=$(lsb_release -cs)

          sudo dpkg --add-architecture arm64

          # Lock existing sources to amd64 (DEB822 format on Ubuntu 24.04)
          sudo python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("/etc/apt/sources.list.d/ubuntu.sources")
          if p.exists():
              txt = p.read_text()
              txt = re.sub(r'(Types: deb(?:\s+deb-src)?)\n(?!Architectures:)',
                           r'\1\nArchitectures: amd64\n', txt)
              p.write_text(txt)
          lp = pathlib.Path("/etc/apt/sources.list")
          if lp.exists():
              lp.write_text(re.sub(r'^deb ', 'deb [arch=amd64] ',
                                   lp.read_text(), flags=re.MULTILINE))
          PY

          # ARM64 packages only from ports.ubuntu.com
          cat <<EOF | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-backports main restricted universe multiverse
          EOF

          sudo apt-get update -qq

          # Cross-compiler + amd64 SDL2 headers (headers are arch-neutral C, fine for cross-compile)
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libsdl2-dev \
            libsdl2-ttf-dev \
            libsdl2-image-dev

          # ARM64 runtime .so files only — avoids the libglib2.0-dev:arm64 conflict
          sudo apt-get install -y \
            libsdl2-2.0-0:arm64 \
            libsdl2-ttf-2.0-0:arm64 \
            libsdl2-image-2.0-0:arm64

          # Create linker symlinks (normally provided by -dev packages)
          sudo ln -sf libSDL2-2.0.so.0     /usr/lib/aarch64-linux-gnu/libSDL2.so
          sudo ln -sf libSDL2_ttf-2.0.so.0 /usr/lib/aarch64-linux-gnu/libSDL2_ttf.so
          sudo ln -sf libSDL2_image-2.0.so.0 /usr/lib/aarch64-linux-gnu/libSDL2_image.so

      - name: Download dependencies
        run: go mod tidy

      - name: Build
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
          CGO_LDFLAGS: "-L/usr/lib/aarch64-linux-gnu"
        run: go build -ldflags="-s -w" -o playtime .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: playtime-arm64
          path: playtime
          retention-days: 30
