name: Build ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up ARM64 cross-compilation environment
        run: |
          set -euo pipefail
          CODENAME=$(lsb_release -cs)

          sudo dpkg --add-architecture arm64

          # Lock existing sources to amd64, add arm64 ports — Python handles DEB822 format
          sudo python3 - "$CODENAME" <<'PY'
          import re, pathlib, sys
          codename = sys.argv[1]

          p = pathlib.Path("/etc/apt/sources.list.d/ubuntu.sources")
          if p.exists():
              txt = p.read_text()
              txt = re.sub(r'(Types: deb(?:\s+deb-src)?)\n(?!Architectures:)',
                           r'\1\nArchitectures: amd64\n', txt)
              p.write_text(txt)

          lp = pathlib.Path("/etc/apt/sources.list")
          if lp.exists():
              txt = lp.read_text()
              txt = re.sub(r'^deb (?!\[)', 'deb [arch=amd64] ', txt, flags=re.MULTILINE)
              lp.write_text(txt)

          pathlib.Path("/etc/apt/sources.list.d/arm64-ports.list").write_text(
              f"deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports {codename} main restricted universe multiverse\n"
              f"deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports {codename}-updates main restricted universe multiverse\n"
              f"deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports {codename}-security main restricted universe multiverse\n"
          )
          PY

          sudo apt-get update -qq

          # Cross-compiler + arm64 runtime .so files + arch-independent header packages.
          # x11proto-dev and xtrans-dev are Architecture:all — NO :arm64 suffix.
          # libsdl2-dev:arm64 is intentionally NOT installed here to avoid the
          # libglib2.0-dev:arm64 conflict; dev headers are extracted below instead.
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            x11proto-dev \
            xtrans-dev \
            libsdl2-2.0-0:arm64 \
            libsdl2-ttf-2.0-0:arm64 \
            libsdl2-image-2.0-0:arm64

          # Download arm64 dev .debs without installing (download avoids all conflicts).
          # Also download arch-independent packages (no :arm64) to seed the sysroot so
          # the cross-compiler finds X11/X.h and friends alongside the arm64 headers.
          mkdir -p /tmp/sdl2/sysroot
          cd /tmp/sdl2
          apt-get download \
            libsdl2-dev:arm64 libsdl2-ttf-dev:arm64 libsdl2-image-dev:arm64 \
            libx11-dev:arm64 libxcb1-dev:arm64 libxau-dev:arm64 libxdmcp-dev:arm64 \
            libpthread-stubs0-dev:arm64 \
            libxext-dev:arm64 libxfixes-dev:arm64 libxrender-dev:arm64 \
            libxrandr-dev:arm64 libxinerama-dev:arm64 libxi-dev:arm64 libxcursor-dev:arm64 \
            libdrm-dev:arm64 libgbm-dev:arm64 libegl-dev:arm64 \
            libwayland-dev:arm64 libxkbcommon-dev:arm64 libdecor-0-dev:arm64
          apt-get download x11proto-dev xtrans-dev
          for deb in *.deb; do dpkg-deb -x "$deb" sysroot; done

          # Linker symlinks: -lSDL2 etc. need unversioned .so at link time
          sudo ln -sf libSDL2-2.0.so.0       /usr/lib/aarch64-linux-gnu/libSDL2.so
          sudo ln -sf libSDL2_ttf-2.0.so.0   /usr/lib/aarch64-linux-gnu/libSDL2_ttf.so
          sudo ln -sf libSDL2_image-2.0.so.0 /usr/lib/aarch64-linux-gnu/libSDL2_image.so

          # Write pkg-config files.
          # go-sdl2 dynamic build calls: pkg-config sdl2 (sdl + img packages)
          #                               pkg-config SDL2_ttf (ttf package)
          # img uses pkg-config:sdl2 + hardcoded -lSDL2_image LDFLAGS, so no SDL2_image.pc needed.
          python3 - <<'PY2'
          import pathlib
          inc = "/tmp/sdl2/sysroot/usr/include"
          lib = "/usr/lib/aarch64-linux-gnu"
          d = pathlib.Path("/tmp/sdl2-pc")
          d.mkdir(exist_ok=True)

          (d / "sdl2.pc").write_text(
              "Name: SDL2\n"
              "Description: Simple DirectMedia Layer\n"
              "Version: 2.0.0\n"
              f"Cflags: -I{inc}/SDL2 -I{inc}/aarch64-linux-gnu/SDL2 -D_REENTRANT\n"
              f"Libs: -L{lib} -lSDL2\n"
              "Libs.private: -lm -ldl -lpthread\n"
          )
          (d / "SDL2_ttf.pc").write_text(
              "Name: SDL2_ttf\n"
              "Description: TrueType font rendering for SDL2\n"
              "Version: 2.0.0\n"
              "Requires: sdl2\n"
              f"Cflags: -I{inc}/SDL2\n"
              f"Libs: -L{lib} -lSDL2_ttf\n"
          )
          PY2

      - name: Download dependencies
        run: go mod tidy

      - name: Build
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH: /tmp/sdl2-pc
          PKG_CONFIG_ALLOW_CROSS: "1"
          # Include both the generic SDL2 header path and the arch-specific path
          # (aarch64-linux-gnu/SDL2/) which contains _real_SDL_config.h and other
          # arch-specific headers. The sysroot also has X11/, wayland/, drm/ etc.
          CGO_CFLAGS: >-
            -I/tmp/sdl2/sysroot/usr/include
            -I/tmp/sdl2/sysroot/usr/include/aarch64-linux-gnu
          CGO_LDFLAGS: "-L/usr/lib/aarch64-linux-gnu"
        run: go build -ldflags="-s -w" -o playtime .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: playtime-arm64
          path: playtime
          retention-days: 30
