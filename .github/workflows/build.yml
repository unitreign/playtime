name: Build ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install ARM64 cross-compiler and SDL2 libs
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libsdl2-dev:arm64 \
            libsdl2-ttf-dev:arm64 \
            libsdl2-image-dev:arm64

      - name: Build
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
          CGO_CFLAGS: "-I/usr/include/SDL2"
          CGO_LDFLAGS: "-L/usr/lib/aarch64-linux-gnu"
        run: go build -ldflags="-s -w" -o playtime .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: playtime-arm64
          path: playtime
          retention-days: 30
