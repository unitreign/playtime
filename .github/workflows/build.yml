name: Build ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install ARM64 cross-compiler and SDL2 libs
        run: |
          CODENAME=$(lsb_release -cs)

          sudo dpkg --add-architecture arm64

          # Ubuntu 24.04 uses DEB822 format — add Architectures: amd64 to every stanza
          # so apt doesn't try to fetch arm64 from archive/security.ubuntu.com (404)
          sudo python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("/etc/apt/sources.list.d/ubuntu.sources")
          if p.exists():
              txt = p.read_text()
              # Insert 'Architectures: amd64' after each 'Types: deb' line if not already present
              txt = re.sub(r'(Types: deb(?:\s+deb-src)?)\n(?!Architectures:)',
                           r'\1\nArchitectures: amd64\n', txt)
              p.write_text(txt)
          # Also lock the legacy .list file if present
          lp = pathlib.Path("/etc/apt/sources.list")
          if lp.exists():
              lp.write_text(re.sub(r'^deb ', 'deb [arch=amd64] ',
                                   lp.read_text(), flags=re.MULTILINE))
          PY

          # Add arm64 sources from ports.ubuntu.com
          cat <<EOF | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-backports main restricted universe multiverse
          EOF

          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libsdl2-dev:arm64 \
            libsdl2-ttf-dev:arm64 \
            libsdl2-image-dev:arm64

      - name: Build
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
          CGO_LDFLAGS: "-L/usr/lib/aarch64-linux-gnu"
        run: go build -ldflags="-s -w" -o playtime .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: playtime-arm64
          path: playtime
          retention-days: 30
