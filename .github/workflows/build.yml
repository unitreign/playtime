name: Build ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install ARM64 cross-compiler and SDL2 libs
        run: |
          # Get the current Ubuntu codename (noble on ubuntu-latest)
          CODENAME=$(lsb_release -cs)

          sudo dpkg --add-architecture arm64

          # Restrict existing sources to amd64 only
          sudo sed -i 's/^Types: deb$/Types: deb/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list 2>/dev/null || true

          # Add arm64 sources from ports.ubuntu.com
          cat <<EOF | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-backports main restricted universe multiverse
          EOF

          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libsdl2-dev:arm64 \
            libsdl2-ttf-dev:arm64 \
            libsdl2-image-dev:arm64

      - name: Build
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
          CGO_LDFLAGS: "-L/usr/lib/aarch64-linux-gnu"
        run: go build -ldflags="-s -w" -o playtime .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: playtime-arm64
          path: playtime
          retention-days: 30
